plugins {
    id "com.android.application"
}

android {
    namespace "io.github.kangweizhu.backupcallingfixer"
    compileSdk 36

    defaultConfig {
        applicationId "io.github.kangweizhu.backupcallingfixer"
        minSdk 30
        targetSdk 36
        versionCode 1
        versionName "1.0.0"
    }

    buildFeatures {
        aidl true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "dev.rikka.shizuku:api:13.1.5"
    implementation "dev.rikka.shizuku:provider:13.1.5"
}
