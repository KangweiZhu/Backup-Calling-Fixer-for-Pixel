plugins {
    id "com.android.application"
}

// The release workflow passes the tag as -PappVersionName=X.Y.Z; versionCode is derived from it
// so every release can upgrade the previous one.
def appVersionName = (project.findProperty("appVersionName") ?: "1.0.0").toString()
def appVersionCode = appVersionName.tokenize(".").collect { it as int }.with {
    it[0] * 10000 + it[1] * 100 + it[2]
}

// Release signing comes from the environment (GitHub Actions secrets). Without it, assembleRelease
// still works but produces an unsigned APK.
def releaseKeystore = System.getenv("RELEASE_KEYSTORE_FILE")

android {
    namespace "io.github.kangweizhu.backupcallingfixer"
    compileSdk 36

    defaultConfig {
        applicationId "io.github.kangweizhu.backupcallingfixer"
        minSdk 30
        targetSdk 36
        versionCode appVersionCode
        versionName appVersionName
    }

    signingConfigs {
        release {
            if (releaseKeystore) {
                storeFile file(releaseKeystore)
                storePassword System.getenv("RELEASE_KEYSTORE_PASSWORD")
                keyAlias System.getenv("RELEASE_KEY_ALIAS")
                keyPassword System.getenv("RELEASE_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            // The app talks to hidden system services through reflection; keep code as-is.
            minifyEnabled false
            if (releaseKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }

    buildFeatures {
        aidl true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "dev.rikka.shizuku:api:13.1.5"
    implementation "dev.rikka.shizuku:provider:13.1.5"
}
